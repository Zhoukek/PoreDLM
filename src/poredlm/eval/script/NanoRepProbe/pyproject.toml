[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanorepprobe"
version = "0.1.1"
description = "Reproducible frozen-feature cross-domain probes for nanopore signal representations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "threadpoolctl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
nanorepprobe = "nanorepprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
