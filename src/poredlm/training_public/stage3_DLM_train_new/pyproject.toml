[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porelm-training"
version = "0.1.0"
description = "Stage-3 flow-matching training for PoreLM"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.28",
  "cached-path>=1.6",
  "datasets>=2.18",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "packaging>=23",
  "PyYAML>=6.0",
  "requests>=2.31",
  "rich>=13",
  "safetensors>=0.4",
  "scikit-learn>=1.3",
  "tokenizers>=0.15",
  "torch>=2.1",
  "torchmetrics>=1.3",
  "tqdm>=4.66",
  "transformers>=4.40",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16"]
test = ["pytest>=8.0"]

[project.scripts]
porelm-train-lite = "porelm_training.train:main"

[tool.setuptools.packages.find]
where = ["src"]
