run_name: porelm-flow-matching
objective: flow_matching

model:
  context_encoder_path: /path/to/stage2/context_encoder
  freeze_context_encoder: true
  size: base
  max_length: 1536
  vocab_size: 65664
  bottleneck_dim: 128
  num_time_tokens: 4
  num_self_condition_tokens: 4
  num_mode_tokens: 4
  attention_dropout: 0.0
  projection_dropout: 0.0

flow_matching:
  timestep_mean: -1.5
  timestep_std: 0.8
  timestep_schedule: logit_normal
  noise_scale: 2.0
  timestep_epsilon: 0.05
  self_condition_probability: 0.5
  guidance_scale_min: 0.0
  guidance_scale_max: 1.0
  decoder_probability: 0.2
  decoder_noise_scale: 5.0
  decoder_timestep_mean: 0.8
  decoder_timestep_std: 0.8

conditioning:
  mode: mixed
  unconditional_probability: 0.2
  pattern: mixed
  min_span_length: 30
  max_span_length: 50
  multi_min_spans: 4
  multi_max_spans: 8
  prefix_suffix_weight: 0.2
  single_span_weight: 0.3
  multi_span_weight: 0.5

data:
  train_paths:
    - /path/to/train_tokens
  eval_paths: []
  dtype: uint32
  pad_token_id: 1
  bos_token_id: 2
  eos_token_id: 3
  num_workers: 4
  pin_memory: true

optimizer:
  learning_rate: 1.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  epsilon: 1.0e-8
  max_grad_norm: 1.0
  warmup_steps: 200
  minimum_lr_ratio: 0.01

training:
  output_dir: outputs/flow_matching
  seed: 6198
  epochs: 5
  global_batch_size: 64
  micro_batch_size: 8
  precision: bf16
  log_interval: 10
  eval_interval: 1000
  eval_batches: 20
  save_interval: 1000
  keep_checkpoints: 5
  resume_from: null

tracking:
  enabled: false
  project: porelm-stage3
  entity: null
