run_name: porelm-self-flow-V003_1
seed: 6198
dry_run: false

dlm:
  context_encoder_path: /mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage2_BERT_trian/runs/HF_VQE768C08A001_DNADLLM_V003/models/step_240000
  training_objective: self_flow
  freeze_context_encoder: true
  max_length: 1536

  model: flow_matching_b
  bottleneck_dim: 128
  num_time_tokens: 4
  num_self_cond_cfg_tokens: 4
  num_model_mode_tokens: 4
  attn_dropout: 0.0
  proj_dropout: 0.0

  denoiser_p_mean: -1.5
  denoiser_p_std: 0.8
  denoiser_noise_scale: 2.0
  t_eps: 0.05
  time_schedule: logit_normal

  decoder_prob: 0.2
  decoder_noise_scale: 5.0
  decoder_p_mean: 0.8
  decoder_p_std: 0.8

  self_cond_prob: 0.5
  self_cond_cfg_min: 0.0
  self_cond_cfg_max: 1.0

  self_flow_mask_ratio: 0.25
  self_flow_student_layer: 6
  self_flow_teacher_layer: 12
  self_flow_loss_weight: 0.1
  self_flow_teacher_ema_decay: 0.9999
  self_flow_teacher_update_interval: 1
  self_flow_feature_loss: cosine

  conditioning_mode: mixed
  unconditional_prob: 0.5
  condition_pattern: mixed
  condition_prefix_suffix_weight: 0.2
  condition_single_span_weight: 0.3
  condition_multi_span_weight: 0.5
  condition_min_span_length: 30
  condition_max_span_length: 50
  condition_multi_min_spans: 4
  condition_multi_max_spans: 8
  label_drop_prob: 0.0

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 8
  weight_tying: false
  alibi: false
  rope: true
  flash_attention: true
  attention_dropout: 0.0
  include_bias: false
  clip_qkv: null
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1.0e-6
  bias_for_layer_norm: false
  attention_layer_norm: true
  attention_layer_norm_with_affine: true
  norm_after: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 1536
  vocab_size: 65664
  embedding_size: 65664
  eos_token_id: 3
  pad_token_id: 1
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

compile: null

optimizer:
  name: adamw
  learning_rate: 1.0e-4
  weight_decay: 0.1
  eps: 1.0e-8
  decay_norm_and_bias: true
  decay_embeddings: true
  betas: [0.9, 0.95]
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  units: steps
  t_warmup: 200
  alpha_f: 0.01
  warmup_min_lr: 0

tokenizer:
  identifier: /mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/data/stage2_BERT_Encoder/tokenizer-64k.json
  truncate_direction: right

save_folder: runs/HF_VQE768C08A001_DNADLLM_V003_1
save_overwrite: true
save_interval: 1000
save_interval_ephemeral: null
save_num_checkpoints_to_keep: 0
sharded_checkpointer: porelm_core
save_interval_unsharded: 1000
save_num_unsharded_checkpoints_to_keep: 5
load_path: null
max_duration: 5ep

global_train_batch_size: 64
device_train_microbatch_size: 4
precision: amp_bf16
distributed_strategy: fsdp

fsdp:
  wrapping_strategy: null
  sharding_strategy: SHARD_GRAD_OP
  precision: mixed

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

gen1_gc_interval: 10

