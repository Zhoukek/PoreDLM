run_name: "PoreCodec_BlockMLP_VQ_8k_v010"
seed: 6198
dry_run: false

wandb:
  entity: "zhoukek-zhejiang-university"
  project: "stage1_tokenizer_public"
  name: ${run_name}

model:
  model_type: "vq_block_mlp"
  block_mlp_vq:
    block_size: 5
    chunk_size: 6000
    latent_dim: 768
    encoder_hidden_dims: [128, 256, 512, 1024]
    decoder_hidden_dims: [1024, 512, 256, 128]
    codebook_decay: 0.99
    codebook_emadc: 2
    learnable_codebook: false
    use_layer_norm: false
  codebook_size: 65536
  codebook_dim: 768
  codebook_nqtz: 1

loss_weights:
  commitment_weight: 9.0
  commitment_weight_lr: 0.001
  use_dynamic_commitment_weight: true
  commitment_weight_freeze_steps: 1000
  commitment_weight_rpc: 10
  codebook_diversity_loss_weight: 0.0
  orthogonal_reg_weight: 0.0
  update_loss_weight_every: 10

optimizer:
  name: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 0.01
  eps: 1.0e-8

scheduler:
  name: "cosine"
  t_warmup: 500
  warmup_start_factor: 1.0e-6
  warmup_end_factor: 1.0
  main_scheduler_end_factor: 1.0e-6

train_data:
  paths:
    # - "/mnt/zzbnew/poregpt/datasets/RNA_S0_HEK293T_MIX_250NC02303011/trank_appleq50/train"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S0_HG00200_MIX_250F701586013/trank_appleq50/train"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S0_HG00200_UMD_250F601844011/trank_appleq50/train"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S0_HG00200_MIX_250F701586012/trank_appleq50/train"
    # - "/mnt/zzbnew/poregpt/datasets/RNA_S0_HEK293T_MIX_250NC02106021/trank_appleq50/train"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S1_HG00200_MIX_250F701901011/trank_appleq50/train"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S1_HG00200_MIX_250F701901011/trank_stoneq00/train"
    # - "/mnt/zzbnew/poregpt/datasets/RNA_S0_MOUSE00_MIX_250NC02165011/trank_appleq50/train"
    # - "/mnt/zzbnew/rnamodel/data/DNA_data/ONT/ONT-R10-HG002-5K/PBA15131/trank_appleq50/train"
    # - "/mnt/zzbnew/rnamodel/data/DNA_data/ONT/ONT-R10-HG002-5K/PBA15131/basecall_f25_trank_stoneq50/train"
    - "/mnt/zzbnew/poregpt/datasets/Cyclone_DNA_S1_ONT_R10_MIX_TOKENS/tranks_stoneq00_s1/train"
  chunk_size: 6000
  memmap_dtype: "float32"
  buffer_size: 20000
  num_workers: 8
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true

eval_data:
  paths:
    # - "/mnt/zzbnew/poregpt/datasets/RNA_S0_HEK293T_MIX_250NC02303011/trank_appleq50/eval"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S0_HG00200_MIX_250F701586013/trank_appleq50/eval"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S0_HG00200_UMD_250F601844011/trank_appleq50/eval"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S0_HG00200_MIX_250F701586012/trank_appleq50/eval"
    # - "/mnt/zzbnew/poregpt/datasets/RNA_S0_HEK293T_MIX_250NC02106021/trank_appleq50/eval"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S1_HG00200_MIX_250F701901011/trank_appleq50/eval"
    # - "/mnt/zzbnew/poregpt/datasets/DNA_S1_HG00200_MIX_250F701901011/trank_stoneq00/eval"
    # - "/mnt/zzbnew/poregpt/models/HF_VQE768C08A001_DNADLLM_V004/tokenizer1_small_eval"
    # - "/mnt/zzbnew/poregpt/datasets/RNA_S0_MOUSE00_MIX_250NC02165011/trank_appleq50/eval"
    # - "/mnt/zzbnew/rnamodel/data/DNA_data/ONT/ONT-R10-HG002-5K/PBA15131/trank_appleq50/eval"
    # - "/mnt/zzbnew/rnamodel/data/DNA_data/ONT/ONT-R10-HG002-5K/PBA15131/basecall_f25_trank_stoneq50/eval"
    - "/mnt/zzbnew/poregpt/datasets/Cyclone_DNA_S1_ONT_R10_MIX_TOKENS/tranks_stoneq00_s1/eval"
  chunk_size: 6000
  val_ratio: 0.001
  memmap_dtype: "float32"
  buffer_size: 0
  num_workers: 2
  drop_last: false
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false

save_folder: "save/porecodec_block_mlp_vq_output"
save_overwrite: true
save_interval: 5000
eval_interval: 5000
max_duration: 2000000
max_eval_batches: 100
global_train_batch_size: 64
device_train_microbatch_size: 16
device_eval_batch_size: ${device_train_microbatch_size}
precision: "bf16"
max_grad_norm: 1.0
load_path: null
reset_optimizer_state: false
