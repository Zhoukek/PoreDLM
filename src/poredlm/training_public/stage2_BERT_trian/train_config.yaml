seed: 42

reproducibility:
  seed: 42

data:
  # Point these to directories produced by token_dataset/infer.py.
  # Each directory should contain paired *.npy and *.csv.gz files.
  train_dir: "/mnt/si002562jbsc/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage2_BERT_trian/token_dataset/eval"
  valid_dir: "/mnt/si002562jbsc/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage2_BERT_trian/token_dataset/eval"
  file_pattern: "*.npy"
  token_dtype: "uint32"
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  train_shuffle_files: true
  valid_shuffle_files: false

model:
  # infer.py writes shifted codebook tokens: token_id = codebook_id + token_offset.
  # For a 64K VQ codebook with token_offset=128, the max token id is 65663,
  # so vocab_size must be at least 65664.
  vocab_size: 65664
  pad_token_id: 1
  mask_token_id: 4
  random_token_min_id: 128
  random_token_max_id: 65664
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 1280
  mask_probability: 0.15
  init_from_pretrained:

training:
  max_train_steps: 250000
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  lr_scheduler_type: cosine
  device_micro_batch_size: 16
  gradient_accumulation_steps: 1
  mixed_precision: "no"
  gradient_clipping: 1.0
  output_dir: "models"
  log_dir: "log"
  log_every_steps: 10
  eval_every_steps: 1000
  max_eval_batches: 100
  save_every_steps: 5000

wandb:
  use_wandb: false
  project: "poredlm-stage2-bert"
  name: "stage2_bert_memmap"
