model:
  # 推荐通过 TOKENIZER_CHECKPOINT 指定实际训练完成的 checkpoint。
  model_dir: "/mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage1_tokenizer_train/runs/HF_VQE768C08A001_DNADLLM_V010/save/porecodec_block_mlp_vq_output/checkpoint-2000000"
