device: auto

data:
  eval_path: /mnt/zzbnew/poregpt/datasets/DNA_S1_HG00200_MIX_250F701901011/tokens_appleq50_pore_codec_vqe768c08a-001/eval
  file_pattern: "*.npy"
  token_dtype: uint32
  # Use the first num_chunks samples beginning at start_index. Set
  # sample_indices to an explicit list to evaluate exactly the same chunks later.
  num_chunks: 10
  start_index: 0
  sample_indices: null
  token_offset: 128
  codebook_size: 65536
  codec_layer: 0
  bos_token_id: 2
  eos_token_id: 3

models:
  dlm_path: /mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage3_DLM_train/runs/HF_VQE768C08A001_DNADLLM_V002/hf_dlm_condition
  tokenizer_path: /mnt/zzbnew/poregpt/models/HF_VQE768C08A001_DNADLLM_V002/encoder

evaluation:
  # Number of content/codebook tokens; BOS and EOS are added separately.
  total_length: 1200
  mask_lengths: [5, 10, 20, 30, 40, 50, 75, 100, 150, 200, 300, 400]
  # The prediction interval is centered at these fractions of the content chunk.
  positions:
    front: 0.2
    middle: 0.5
    back: 0.8
  # Reduce this if a 1200-token attention pass runs out of accelerator memory.
  batch_size: 32
  num_steps: 64
  sampling_method: ode
  sde_gamma: 0.1
  cfg_scale: 1.0
  self_cond_cfg_scale: 1.0
  seed: 6198
  mask_token_id: null
  restrict_to_codebook: true

output:
  directory: outputs/generative_capability_statistics
