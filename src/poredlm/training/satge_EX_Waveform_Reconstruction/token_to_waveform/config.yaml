device: auto

data:
  eval_path: /mnt/zzbnew/poregpt/datasets/DNA_S1_HG00200_MIX_250F701901011/tokens_appleq50_pore_codec_vqe768c08a-001/eval
  file_pattern: "*.npy"
  token_dtype: uint32
  sample_indices: [10]
  token_offset: 128
  codebook_size: 65536
  bos_token_id: 2
  eos_token_id: 3

models:
  dlm_path: /mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage3_DLM_train/runs/test/hf_dlm_condition
  tokenizer_path: /mnt/zzbnew/poregpt/models/HF_VQE768C08A001_DNADLLM_V001/encoder

generation:
  # Content-token coordinates are zero-based. This masks the 1001st-1100th
  # content tokens while keeping tokens on both sides as conditions.
  total_length: 1200
  mask_start: 600
  mask_length: 600
  # null uses the mask_token_id stored in the embedded Stage-2 BERT config.
  mask_token_id: null
  num_steps: 64
  sampling_method: ode
  sde_gamma: 0.1
  cfg_scale: 1.0
  self_cond_cfg_scale: 1.0
  seed: 6198
  # Mask BOS/EOS/PAD and select generated positions only from codebook tokens.
  restrict_to_codebook: true
  # "error" is scientifically safe. "clip" is only useful for diagnostics.
  invalid_token_policy: error

output:
  directory: outputs/token_to_waveform
