device: auto

data:
  # eval_path: /mnt/zzbnew/poregpt/datasets/DNA_S0_HG00200_MIX_250F701586013/tokens_appleq50_pore_codec_vqe768c08a-007/eval
  eval_path: /mnt/zzbnew/poregpt/datasets/Cyclone_DNA_S1_ONT_R10_MIX_TOKENS/tokens_appleq50_pore_codec_vqe768c08a-006-new/eval
  # GPT must use token shards produced by its matching RSQ codec, not the VQE
  # shards above. Replace this placeholder before running generator_type=gpt.
  gpt_eval_path: /mnt/zzbnew/poregpt/datasets/MIX_LLM_TOKENS_eval/tokens_tvfirq50_pore-codec-rsq741c12v-523/DNA_S1_HG00200_MIX_250F701901011
  file_pattern: "*.npy"
  # DLM and GPT token shards use different storage dtypes.
  dlm_token_dtype: uint32
  gpt_token_dtype: uint16
  sample_indices: [6679]
  # Generator-specific token layouts. DLM uses its 64k VQ codebook; GPT uses a
  # packed residual-RSQ codebook and must not reuse the DLM codebook size.
  dlm_token_offset: 128
  dlm_codebook_size: 65536
  # dlm_codebook_size: 8192
  dlm_codec_layer: 0
  gpt_token_offset: 128
  # This GPT was trained with the first RSQ layer only: 7^4 = 2401 tokens.
  gpt_codec_layer: 1
  # null infers product(fsq_levels) ** gpt_codec_layer from the GPT encoder.
  gpt_codebook_size: null
  bos_token_id: 2
  eos_token_id: 3

models:
  # dlm_path: /mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage3_DLM_train/runs/HF_VQE768C08A001_DNADLLM_V001_mix/hf_dlm_step69000
  # dlm_path: /mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage3_DLM_train/runs/HF_VQE768C08A001_DNADLLM_V004/hf_dlm_step70000
  dlm_path: /mnt/zzbnew/poregpt/models/HF_VQE768C08A001_DNADLLM_V006/hf_dlm
  # dlm_path: /mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage3_DLM_train_new/scripts/runs/HF_VQE768C08A001_DNADLLM_V007_self_flow/hf_dlm_step34000
  # Exact checkpoint used by stage2_BERT_trian/eval. Set null to use the BERT
  # embedded in hf_dlm_condition instead.
  bert_path: /mnt/zzbnew/poregpt/models/HF_VQE768C08A001_DNADLLM_V002/HF_BERT_part
  # Standard HF causal LM converted by convert_olmo2_to_hf.py.
  gpt_path: /mnt/zzbnew/poregpt/models/HF_RSQ741C12V523_MIXOLMO_V610/base
  # Optional per-generator codecs. The GPT codec is RSQ/FSQ and ships
  # modeling_pore_codec.py; the DLM codec currently uses modeling_pore_vq_codec.py.
  gpt_tokenizer_path: /mnt/zzbnew/poregpt/models/HF_RSQ741C12V523_MIXOLMO_V610/encoder
  tokenizer_path: /mnt/zzbnew/poregpt/models/HF_VQE768C08A001_DNADLLM_V006/encoder
  # tokenizer_path: /mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/src/poredlm/training_public/stage1_tokenizer_train/runs/HF_VQE768C08A001_DNADLLM_V007/outputs/test_PoreCodec_VQ_8k_cnn0/checkpoint-40000

generation:
  # Choose exactly one generator per run: dlm or gpt.
  generator_type: dlm
  # Content-token coordinates are zero-based. DLM can condition on both sides;
  # GPT predicts left-to-right from the prefix and cannot see the right side.
  total_length: 1200
  mask_start: 1000
  mask_length: 30
  # DLM only: null uses the embedded Stage-2 BERT mask_token_id.
  mask_token_id: null
  num_steps: 64
  sampling_method: ode
  sde_gamma: 0.1
  cfg_scale: 1.0
  self_cond_cfg_scale: 1.0
  seed: 6198
  # Mask BOS/EOS/PAD and select generated positions only from codebook tokens.
  restrict_to_codebook: true
  # "error" is scientifically safe. "clip" is only useful for diagnostics.
  invalid_token_policy: error

output:
  directory: figure/outputs/token_to_waveform_V006-new