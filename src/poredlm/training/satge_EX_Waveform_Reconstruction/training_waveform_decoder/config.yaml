seed: 42

data:
  # Same FlowMap/Dolma token shards consumed by Stage 2 and Stage 3.
  train_paths:
    - /mnt/zzbnew/poregpt/datasets/DNA_S1_HG00200_MIX_250F701901011/tokens_appleq50_pore_codec_vqe768c08a-001/train
  valid_paths:
    - /mnt/zzbnew/poregpt/datasets/DNA_S1_HG00200_MIX_250F701901011/tokens_appleq50_pore_codec_vqe768c08a-001/eval
  file_pattern: "*.npy"
  token_dtype: uint32
  token_offset: 128
  codebook_size: 65536
  pad_token_id: 1
  bos_token_id: 2
  eos_token_id: 3
  max_length: 1536
  strict_boundaries: true
  train_shuffle_files: true
  valid_shuffle_files: false
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true

model:
  dlm_path: /mnt/zzbnew/poregpt/models/HF_VQE768C08A001_DNADLLM_V001/hf_dlm
  # Optional. If omitted, train.py auto-detects stage3_DLM_train/ELF-pytorch-port/src.
  elf_src_path:
  # This must be the Stage 1 save_pretrained model directory, not merely the run YAML directory.
  tokenizer_path: /mnt/zzbnew/poregpt/models/HF_VQE768C08A001_DNADLLM_V001/encoder
  hidden_size: 768
  # context_hidden_state | last_hidden_state | ode_hidden_state | sde_hidden_state
  hidden_state_key: last_hidden_state
  initialize_from_tokenizer_decoder: true

sampling:
  ode_steps: 2
  ode_start_t: 0.98
  ode_self_cond_cfg_scale: 0.0
  sde_steps: 4
  sde_start_t: 0.85
  sde_gamma: 0.1
  sde_self_cond_cfg_scale: 1.0
  sde_seed: 6198

training:
  max_steps: 200000
  micro_batch_size: 64
  valid_batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  mixed_precision: bf16
  max_grad_norm: 1.0
  # Match Stage 1 PoreVQWrapper: F.mse_loss(recon, target).
  loss_type: mse
  loss_reduction: mean
  log_every_steps: 10
  eval_every_steps: 1000
  max_eval_batches: 100
  save_every_steps: 5000
  output_dir: outputs/waveform_decoder

wandb:
  enabled: true
  project: waveform_decoder
  name: dlm_ode_to_stage1_waveform
