seed: 42

reproducibility:
  seed: 42

data:
  train_dir: "/mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/data/DNA_modifiction/S0_HG002_UNMOD-35g/stage2_BERT/01_S0_HG002_UNMOD_35g_model_type_1_cnn_type_0_distill_0.1_8k_vq_split_600/train/temp"
  valid_dir: "/mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/data/DNA_modifiction/S0_HG002_UNMOD-35g/stage2_BERT/01_S0_HG002_UNMOD_35g_model_type_1_cnn_type_0_distill_0.1_8k_vq_split_600/validation/temp"
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true
  streaming: false
  max_cache_files: 32

model:
  # Stage1 codebook ids are shifted by 5 in the Stage2 tokenizer vocabulary.
  tokenizer_path: "/mnt/zzbnew/rnamodel/zhoukexuan/PoreDLM/data/DNA_modifiction/S0_HG002_UNMOD-35g/stage2_BERT/00_S0_HG002_UNMOD_35g_model_type_0_cnn_type_0_8k_vq_split_600/tokenizer-8k.json"
  codebook_vocab_offset: 5

  vocab_size: 8197
  mask_token_id: 4
  pad_token_id: 1
  unk_token_id: 0
  random_token_min_id: 5
  random_token_max_id: 8197
  d_model: 768
  layers: 12
  heads: 12
  dropout: 0.1
  max_position_embeddings: 1024

  # Jiaheng v6 uses train_masked_lm.py's simple random-token BERT masking.
  mask_probability: 0.15

training:
  # Strict epoch-driven training. Keep data.streaming=false so the dataloader has
  # a real len() and scheduler steps are inferred from complete epochs.
  num_train_epochs: 10
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  lr_scheduler_type: cosine
  device_micro_batch_size: 32
  gradient_accumulation_steps: 1
  mixed_precision: "no"
  gradient_clipping: 1.0
  output_dir: "models"
  log_dir: "log"
  log_every_steps: 10
  eval_every_steps: 0
  eval_each_epoch: true
  max_eval_batches: 100
  save_every_steps: 0
  save_each_epoch: true

wandb:
  use_wandb: True
  project: "stage2_BERT_Encoder_experiments"
  name: "02_BERT_12_layer_jiaheng"
